<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About - MUAI</title>
    <link rel="stylesheet" href="./Css/Fonts.css" />
    <link rel="stylesheet" href="./Css/Common.css" />
    <link rel="stylesheet" href="./Css/Header-Footer.css" />
    <link rel="stylesheet" href="./Css/About.css" />
  </head>
  <body>
    <header class="main-header">
      <nav class="nav" aria-label="Main">
        <a href="./Home.html" class="nav__logo">MUAI</a>
        <button
          class="nav__toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="main-navigation nav-cta"
        >
          <span class="nav__bar nav__bar--top"></span>
          <span class="nav__bar nav__bar--bottom"></span>
        </button>
        <ul class="nav__list" id="main-navigation">
          <li class="nav__item">
            <a class="nav__link" href="./Home.html">Home</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="./Pricing.html">Pricing</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="./About.html">About</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="./Contact.html">Contact</a>
          </li>
        </ul>
        <ul class="nav__list" id="nav-cta">
          <li class="nav__item">
            <a href="#" class="btn btn--primary btn--sm nav__cta"
              >Get Started</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <h1 style="color: var(--color-primaray100); font-weight: bolder">
      Not yet ready kiyomarth
    </h1>
    <footer class="footer">
      <div class="footer__container">
        <div class="footer__glow" aria-hidden="true"></div>
        <p class="footer__logo">MUAI</p>
        <nav class="footer__pages" aria-label="Footer">
          <a href="./Home.html" class="footer__link">Home</a>
          <a href="./Pricing.html" class="footer__link">Pricing</a>
          <a href="./About.html" class="footer__link">About</a>
          <a href="./Contact.html" class="footer__link">Contact</a>
          <a class="btn btn--primary footer__cta" href="#">Get Started</a>
        </nav>
        <div class="footer__contact-us">
          <a class="footer__contact-link" href="mailto:youremail@mail.com">
            <img
              src="./Assets/Icon/Vector.svg"
              class="footer__contact-icons"
              alt=""
              width="18"
              height="21"
            />
            youremail@mail.com
          </a>
          <a
            class="footer__contact-link"
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="./Assets/Icon/Vector.svg"
              class="footer__contact-icons"
              alt=""
              width="18"
              height="21"
            />
            Instagram
          </a>
          <a
            class="footer__contact-link"
            href="https://maps.google.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="./Assets/Icon/Vector (1).svg"
              class="footer__contact-icons"
              alt=""
              width="18"
              height="21"
            />
            Location
          </a>
        </div>
        <div class="footer__divider" aria-hidden="true"></div>
        <div class="footer__newsletter">
          <p class="newsletter__title">Join to get free updates every week.</p>
          <form class="newsletter__form" action="#">
            <label class="visually-hidden" for="newsletter-email"
              >Email address</label
            >
            <input
              id="newsletter-email"
              class="newsletter__input"
              type="email"
              name="email"
              placeholder="Email Address"
              autocomplete="email"
              required
            />
            <button class="btn btn--primary" type="submit">Subscribe</button>
          </form>
        </div>
        <div class="footer__copyright">
          <p>&copy; <span data-current-year>2026</span> MU.AI</p>
          <p>All Rights Reserved</p>
          <p>Privacy Policy | Terms of Service</p>
        </div>
      </div>
    </footer>
    <script src="./js/mian.js"></script>
  </body>
</html>
